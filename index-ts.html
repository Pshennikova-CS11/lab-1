<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css" />
  <title>Каталог навчальних ресурсів з рейтингом</title>
</head>
<body>

<h1>Каталог навчальних ресурсів</h1>

<div class="layout">
  <div class="entity-block">
    <section class="form-section">
      <h2>Додати ресурс</h2>

      <form id="resourceForm" novalidate>
        <label for="title">Назва</label>
        <input type="text" id="title">
        <p class="error" id="titleError"></p>

        <label for="author">Автор</label>
        <input type="text" id="author">
        <p class="error" id="authorError"></p>

        <label for="url">URL</label>
        <input type="url" id="url">
        <p class="error" id="urlError"></p>

        <label for="type">Тип ресурсу</label>
        <select id="type">
          <option value="">Оберіть тип</option>
          <option value="article">Стаття</option>
          <option value="video">Відео</option>
          <option value="course">Курс</option>
        </select>
        <p class="error" id="typeError"></p>

        <label for="description">Опис</label>
        <textarea id="description"></textarea>
        <p class="error" id="descriptionError"></p>

        <div class="form-buttons">
          <button type="submit" id="submitBtn">Додати ресурс</button>
          <button type="button" id="resetBtn">Очистити</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>Список ресурсів</h2>

      <div id="resourcesStatus" class="status"></div>

      <input type="text" id="searchInput" placeholder="Пошук за назвою">

      <select id="filterType">
        <option value="">Усі типи</option>
        <option value="article">Стаття</option>
        <option value="video">Відео</option>
        <option value="course">Курс</option>
      </select>

      <select id="sortSelect">
        <option value="">Без сортування</option>
        <option value="newest">Спочатку нові</option>
        <option value="oldest">Спочатку старі</option>
      </select>

      <table>
        <thead>
        <tr>
          <th>#</th>
          <th>Назва</th>
          <th>Автор</th>
          <th>Тип</th>
          <th>Середній рейтинг</th>
          <th>URL</th>
          <th>Дії</th>
        </tr>
        </thead>
        <tbody id="resourcesTableBody"></tbody>
      </table>
    </section>
  </div>


  <div class="entity-block">
    <section class="form-section">
      <h2>Користувачі</h2>

      <form id="userForm" novalidate>
        <label for="userName">Ім’я</label>
        <input type="text" id="userName">
        <p class="error" id="userNameError"></p>

        <label for="userEmail">Email</label>
        <input type="email" id="userEmail">
        <p class="error" id="userEmailError"></p>

        <div class="form-buttons">
          <button type="submit" id="userSubmitBtn">Додати користувача</button>
          <button type="button" id="userResetBtn">Очистити</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>Список користувачів</h2>

      <div id="usersStatus" class="status"></div>

      <table>
        <thead>
        <tr>
          <th>#</th>
          <th>Ім’я</th>
          <th>Email</th>
          <th>Дії</th>
        </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </section>
  </div>


  <div class="entity-block">
    <section class="form-section">
      <h2>Коментарі</h2>

      <form id="commentForm" novalidate>
        <label for="commentResourceId">Ресурс</label>
        <select id="commentResourceId"></select>
        <p class="error" id="commentResourceIdError"></p>

        <label for="commentUserId">Користувач</label>
        <select id="commentUserId"></select>
        <p class="error" id="commentUserIdError"></p>

        <label for="commentText">Коментар</label>
        <textarea id="commentText"></textarea>
        <p class="error" id="commentTextError"></p>

        <div class="form-buttons">
          <button type="submit" id="commentSubmitBtn">Додати коментар</button>
          <button type="button" id="commentResetBtn">Очистити</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>Список коментарів</h2>

      <div id="commentsStatus" class="status"></div>

      <table>
        <thead>
        <tr>
          <th>#</th>
          <th>Ресурс</th>
          <th>Користувач</th>
          <th>Коментар</th>
          <th>Дії</th>
        </tr>
        </thead>
        <tbody id="commentsTableBody"></tbody>
      </table>
    </section>
  </div>

  <div class="entity-block">
    <section class="form-section">
      <h2>Рейтинги</h2>

      <form id="ratingForm" novalidate>
        <label for="ratingResourceId">Ресурс</label>
        <select id="ratingResourceId"></select>
        <p class="error" id="ratingResourceIdError"></p>

        <label for="ratingUserId">Користувач</label>
        <select id="ratingUserId"></select>
        <p class="error" id="ratingUserIdError"></p>

        <label for="ratingValue">Оцінка</label>
        <select id="ratingValue">
          <option value="">Оберіть оцінку</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <p class="error" id="ratingValueError"></p>

        <div class="form-buttons">
          <button type="submit" id="ratingSubmitBtn">Додати рейтинг</button>
          <button type="button" id="ratingResetBtn">Очистити</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>Список рейтингів</h2>

      <div id="ratingsStatus" class="status"></div>

      <table>
        <thead>
        <tr>
          <th>#</th>
          <th>Ресурс</th>
          <th>Користувач</th>
          <th>Оцінка</th>
          <th>Дії</th>
        </tr>
        </thead>
        <tbody id="ratingsTableBody"></tbody>
      </table>
    </section>
  </div>

</div>

<div id="undoToast" class="undo-toast hidden">
  <span id="undoToastText"></span>
  <button type="button" id="undoToastBtn">Скасувати</button>
</div>

<script src="./dist-frontend/frontend-ts/apiClient.js"></script>
<script src="./dist-frontend/frontend-ts/app.js"></script>

</body>
</html>
